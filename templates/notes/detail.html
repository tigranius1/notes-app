<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ note.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>{{ note.title }}</h1>
    <p class="text-muted">Создано: {{ note.created_at }}</p>

    {% if note.tags.all %}
    <div class="mb-2">
        {% for tag in note.tags.all %}
            <a href="{% url 'note_list' %}?tag={{ tag.name }}"
               class="badge bg-info text-decoration-none">{{ tag.name }}</a>
        {% endfor %}
    </div>
    {% endif %}

    <div class="card">
        <div class="card-body">
            {{ note.text|linebreaks }}
        </div>
    </div>

    <div class="mt-3">
        <a href="{% url 'note_update' note.pk %}" class="btn btn-warning">Редактировать</a>
        <a href="{% url 'note_list' %}" class="btn btn-secondary">Назад к списку</a>
    </div>
</body>
</html>
